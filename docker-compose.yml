# Production: docker compose up -d --build (on the server, with .env next to this file).
# The web app listens on 127.0.0.1 only; Caddy on the host terminates HTTPS in front of it
# (deploy/Caddyfile). Docker's port rules bypass ufw, so nothing here is published publicly.

x-app: &app
  build: .
  image: bitqube-cloud:latest
  env_file: .env
  environment:
    NODE_ENV: production
  restart: unless-stopped
  # tini as PID 1, so SIGTERM reaches node (the worker finishes its tick on SIGTERM).
  init: true
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # Applies pending Prisma migrations, then exits. web and worker wait for it.
  migrate:
    <<: *app
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"

  web:
    <<: *app
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Finish the current tick on deploy instead of being killed mid-rental.
    stop_grace_period: 2m
