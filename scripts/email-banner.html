<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"../node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#000}</style></head>
<body>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// Renders public/email/qube.gif, the animated banner at the top of customer emails.
// A seamless 48-frame loop: the top and bottom layers twist out and back while the rings
// turn by exactly one repeat of their pattern, so the last frame runs into the first.
//
// To regenerate: serve the project root (python3 -m http.server 8766), open
// http://127.0.0.1:8766/scripts/email-banner.html in Chrome, save renderAt(i / 48) for
// i = 0..47 as PNGs (each returns a data: URL), then with ImageMagick:
//   for f in f*.png; do convert $f -resize 560x243 s_$f; done
//   convert s_f000.png s_f012.png s_f024.png s_f036.png -append +dither -colors 127 -unique-colors pal.png
//   convert -delay 12.5 -loop 0 s_f*.png +dither -remap pal.png tmp.gif
//   convert tmp.gif -fuzz 3% -layers OptimizeTransparency public/email/qube.gif
// Keep it under ~400 KB: every customer email carries it.
const q = new URLSearchParams(location.search);
const W = +q.get("w") || 1200, H = +q.get("h") || 520, BG = q.get("bg") || "#0a0e15";
let seed = 7;
const rnd = () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, 0.35, 9.8);
camera.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(4, 6, 5);
const rim = new THREE.PointLight(0x4fd1c5, 18, 20); rim.position.set(-4, -2, -3);
scene.add(key, rim, new THREE.AmbientLight(0xffffff, 0.15));

const tiltG = new THREE.Group(); tiltG.rotation.x = 0.5; scene.add(tiltG);
const world = new THREE.Group(); world.rotation.y = -0.6; tiltG.add(world);
const SP = 0.7, geo = new RoundedBoxGeometry(0.62, 0.62, 0.62, 4, 0.09);
const cubes = [];
for (let x = -1; x <= 1; x++) for (let y = -1; y <= 1; y++) for (let z = -1; z <= 1; z++) {
  if (!x && !y && !z) continue;
  const gold = x < 0 || (x === 0 && y >= 0);
  const mat = new THREE.MeshPhysicalMaterial({ color: gold ? 0xf0b90b : 0x1786ff, metalness: 0.95, roughness: gold ? 0.26 : 0.3, clearcoat: 0.6, clearcoatRoughness: 0.2, emissive: 0x4fd1c5, emissiveIntensity: 0 });
  const m = new THREE.Mesh(geo, mat); world.add(m); cubes.push({ m, g: new THREE.Vector3(x, y, z) });
}
const cageMat = new THREE.LineBasicMaterial({ color: 0x4fd1c5, transparent: true, opacity: 0.35 });
world.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.9, 2.9, 2.9)), cageMat));
const outer = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(2.9)), new THREE.LineBasicMaterial({ color: 0x1a7dff, transparent: true, opacity: 0.16 }));
tiltG.add(outer);

// Rings whose jitter repeats every 1/R of the circle, turned by exactly 2π/R per loop.
function ring(radius, count, jitter, R) {
  const per = count / R, j = Array.from({ length: per }, () => [rnd() - 0.5, rnd() - 0.5]);
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) { const a = (i / count) * Math.PI * 2, [u, v] = j[i % per], r = radius + u * jitter; pos.set([Math.cos(a) * r, v * jitter * 0.4, Math.sin(a) * r], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); return g;
}
const ringDefs = [[3.1, 260, 0.25, 4, 1, 0x4fd1c5, [1.2, 0, 0.3]], [3.7, 190, 0.35, 5, -1, 0x1a7dff, [0.4, 0, -0.9]], [4.4, 150, 0.5, 6, 1, 0xf0c014, [-0.7, 0, 0.5]]];
const rings = ringDefs.map(([r, c, j, R, dir, col, rot]) => {
  const p = new THREE.Points(ring(r, c, j, R), new THREE.PointsMaterial({ size: 0.05, color: col, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
  const holder = new THREE.Group(); holder.rotation.set(...rot); holder.add(p); scene.add(holder);
  return { p, step: (dir * 2 * Math.PI) / R };
});

// Streams: each particle falls from the shell to the Qube a whole number of times per loop.
const N = 160, dirs = [], phase = [], cyc = [];
for (let i = 0; i < N; i++) {
  const u = rnd() * 2 - 1, t = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u);
  dirs.push(new THREE.Vector3(s * Math.cos(t), u, s * Math.sin(t))); phase.push(rnd()); cyc.push(1 + Math.floor(rnd() * 3));
}
const sPos = new Float32Array(N * 3), sGeo = new THREE.BufferGeometry();
sGeo.setAttribute("position", new THREE.BufferAttribute(sPos, 3));
tiltG.add(new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.05, color: 0x4fd1c5, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false })));

const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const clamp = (x) => Math.max(0, Math.min(1, x));
// Top layer turns at 5% and back at 52%, bottom layer at 28% and back at 75%.
const TW = { 1: 0.05, "-1": 0.28 }, TD = 0.15;
const pulseDir = new THREE.Vector3(1, 0.6, 0.3).normalize(), v = new THREE.Vector3(), yAxis = new THREE.Vector3(0, 1, 0);

const out = document.createElement("canvas"); out.width = W; out.height = H; document.body.appendChild(out);
const ctx = out.getContext("2d");

window.renderAt = (T) => {
  for (const c of cubes) {
    const a = c.g.y === 0 ? 0 : (Math.PI / 2) * c.g.y * (ease(clamp((T - TW[c.g.y]) / TD)) - ease(clamp((T - TW[c.g.y] - 0.47) / TD)));
    v.copy(c.g).applyAxisAngle(yAxis, a).multiplyScalar(SP);
    c.m.position.copy(v);
    const wave = Math.max(0, Math.sin(2 * Math.PI * 2 * T - c.g.dot(pulseDir) * 1.6));
    c.m.material.emissiveIntensity = Math.pow(wave, 12) * 0.3;
  }
  rings.forEach((r) => (r.p.rotation.y = r.step * T));
  for (let i = 0; i < N; i++) { const f = (phase[i] - T * cyc[i]) % 1, r = 1.35 + 4.6 * (f < 0 ? f + 1 : f); v.copy(dirs[i]).multiplyScalar(r); sPos.set([v.x, v.y, v.z], i * 3); }
  sGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);

  // Backdrop: a teal glow behind the Qube that fades to the card colour before the edges.
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * 0.62);
  g.addColorStop(0, "rgba(79,209,197,0.22)"); g.addColorStop(0.45, "rgba(26,125,255,0.08)"); g.addColorStop(1, "rgba(10,14,21,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(renderer.domElement, 0, 0);
  // Soft vignette so particles fade out at the banner's edge.
  const fade = ctx.createLinearGradient(0, 0, W, 0);
  fade.addColorStop(0, BG); fade.addColorStop(0.12, BG + "00"); fade.addColorStop(0.88, BG + "00"); fade.addColorStop(1, BG);
  ctx.fillStyle = fade; ctx.fillRect(0, 0, W, H);
  const fadeV = ctx.createLinearGradient(0, 0, 0, H);
  fadeV.addColorStop(0, BG); fadeV.addColorStop(0.1, BG + "00"); fadeV.addColorStop(0.9, BG + "00"); fadeV.addColorStop(1, BG);
  ctx.fillStyle = fadeV; ctx.fillRect(0, 0, W, H);
  return out.toDataURL("image/png");
};
window.ready = true;
</script></body></html>
